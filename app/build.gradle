
plugins {
    alias(libs.plugins.android.application)
}
def kspFile = rootProject.file('keystore.properties')
def ksp = new Properties()
if (kspFile.exists()){
    ksp.load(new FileInputStream(kspFile))
}
android {
    namespace 'dev.omarhaidar.subflow'
    compileSdk 37

    defaultConfig {
        applicationId "dev.omarhaidar.subflow"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            if (ksp['storeFile'] != null) {
                storeFile rootProject.file(ksp['storeFile'])
                storePassword ksp['storePassword']
                keyAlias ksp['keyAlias']
                keyPassword ksp['keyPassword']
            }
        }
        release {
            if (ksp['storeFile'] != null) {
                storeFile rootProject.file(ksp['storeFile'])
                storePassword ksp['storePassword']
                keyAlias ksp['keyAlias']
                keyPassword ksp['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    testImplementation libs.junit
}

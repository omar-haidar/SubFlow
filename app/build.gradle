
plugins {
    id 'com.android.application'
}
def kspFile = rootProject.file('keystore.properties')
def ksp = new Properties()
if (kspFile.exists()){
    ksp.load(new FileInputStream(kspFile))
}
android {
    namespace 'dev.omarhaidar.subflow'
    compileSdk 37

    defaultConfig {
        applicationId "dev.omarhaidar.subflow"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            if (ksp['storeFile'] != null) {
                storeFile rootProject.file(ksp['storeFile'])
                storePassword ksp['storePassword']
                keyAlias ksp['keyAlias']
                keyPassword ksp['keyPassword']
            }
        }
        release {
            if (ksp['storeFile'] != null) {
                storeFile rootProject.file(ksp['storeFile'])
                storePassword ksp['storePassword']
                keyAlias ksp['keyAlias']
                keyPassword ksp['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'

    testImplementation 'junit:junit:4.13.2'
}

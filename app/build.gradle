
plugins {
    alias(libs.plugins.android.application)
}
def kspFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (kspFile.exists()){
    keystoreProperties.load(new FileInputStream(kspFile))
}
android {
    namespace 'dev.omarhaidar.subflow'
    compileSdk 37

    defaultConfig {
        applicationId "dev.omarhaidar.subflow"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {

            def envStorePassword = System.getenv("KEYSTORE_PASSWORD")

            if (envStorePassword != null && !envStorePassword.isEmpty()) {
                storeFile file("$rootDir/app/release-key.jks")
                storePassword envStorePassword
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
            else if (keystoreProperties && keystoreProperties.getProperty("storePassword") != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    testImplementation libs.junit
}

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # فك تشفير ملف الـ Keystore المخزن في الـ Secrets وضعه في مساره الصحيح
      - name: Decode Keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > app/release-key.jks

      # بناء نسخة Release موقعة (Bundle أو APK حسب رغبتك، سنستخدم assembleRelease لـ APK)
      - name: Build Release APK with Gradle
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/release/app-release.apk SubFlow.apk

      - name: Publish to the single "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SubFlow.apk \
            --title "Latest build" \
            --notes "Automated signed release build from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest